[project]
name = "brasaland-data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "prefect>=3",
    "pandas",
    "sqlmodel",
    "psycopg2-binary",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "qdrant-client",
    "fastembed",
    "openai",
    "langgraph>=1.2.10",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/pipelines"]
pythonpath = ["."]
