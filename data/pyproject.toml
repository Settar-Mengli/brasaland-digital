[project]
name = "brasaland-data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "prefect>=3.7.8,<4",
    "pandas",
    "sqlmodel>=0.0.39,<1",
    "psycopg2-binary",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "qdrant-client",
    "fastembed",
    "openai",
    "langgraph>=1.2.10",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.1",
    "mcp>=1.20.0,<2",
    "redis>=5",
    "markitdown[pdf]",
    "textstat",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/pipelines"]
pythonpath = ["."]
