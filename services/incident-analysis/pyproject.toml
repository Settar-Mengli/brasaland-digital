[project]
name = "incident-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "brasaland-auth-verify",
    "brasaland-proxy-trust",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "python-multipart==0.0.20",
    "slowapi>=0.1.10",
]

[tool.uv.sources]
brasaland-auth-verify = { path = "../../packages/auth-verify", editable = true }
brasaland-proxy-trust = { path = "../../packages/proxy-trust", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
