[project]
name = "rfp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "brasaland-auth-verify",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "python-multipart==0.0.20",
    "pydantic==2.11.4",
    "python-dotenv==1.0.1",
    "sqlmodel>=0.0.39,<1",
    "psycopg2-binary",
    "celery[redis]>=5.6.3,<6",
    "langgraph>=1.2.10",
    "openai",
    "markitdown[pdf]",
    "textstat",
    "langgraph-checkpoint-redis>=0.5.1",
]

[tool.uv.sources]
brasaland-auth-verify = { path = "../../packages/auth-verify", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
