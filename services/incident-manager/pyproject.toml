[project]
name = "incident-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "brasaland-shared",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "tinydb==4.8.2",
    "pydantic==2.11.4",
    "sqlmodel",
    "psycopg2-binary",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.uv.sources]
brasaland-shared = { path = "../../packages/shared", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
