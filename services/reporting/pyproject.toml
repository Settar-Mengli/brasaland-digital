[project]
name = "reporting"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.4",
    "python-dotenv==1.0.1",
    "sqlmodel>=0.0.39,<1",
    "psycopg2-binary",
    "pandas",
    "prefect>=3.4.5,<4",
    "celery[redis]>=5.6.3,<6",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
