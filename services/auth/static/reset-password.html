<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Brasaland Auth</p>
      <h1>Choose a new password</h1>
      <p class="intro">
        Set a new password for your Brasaland account. Reset links are
        single-use and expire after a short time.
      </p>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="reset-heading">
        <h2 id="reset-heading">Reset password</h2>

        <form id="reset-form" class="hidden" novalidate>
          <div class="field">
            <label for="new-password">New password</label>
            <input
              id="new-password"
              name="new-password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submit-btn">
              Update password
            </button>
          </div>
        </form>

        <p
          id="feedback-message"
          class="message hidden"
          role="alert"
          aria-live="assertive"
        ></p>

        <p class="link-row">
          <a href="/forgot-password">Request a new reset link</a>
          ·
          <a href="/login">Back to sign in</a>
        </p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const form = document.getElementById("reset-form");
      const newPasswordInput = document.getElementById("new-password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const submitBtn = document.getElementById("submit-btn");
      const feedbackMessage = document.getElementById("feedback-message");

      function showFeedback(message, isError) {
        feedbackMessage.textContent = message;
        feedbackMessage.classList.remove("hidden");
        feedbackMessage.classList.toggle("error", isError);
        feedbackMessage.classList.toggle("status", !isError);
        feedbackMessage.setAttribute("role", isError ? "alert" : "status");
      }

      if (!token) {
        showFeedback(
          "This reset link is missing a token. Request a new link below.",
          true,
        );
      } else {
        form.classList.remove("hidden");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword.length < 8) {
          showFeedback("Password must be at least 8 characters.", true);
          return;
        }

        if (newPassword !== confirmPassword) {
          showFeedback("Passwords do not match.", true);
          return;
        }

        submitBtn.disabled = true;

        try {
          const response = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: token,
              new_password: newPassword,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showFeedback(
              data.message || "Password has been reset. You can now log in.",
              false,
            );
            form.classList.add("hidden");
            window.setTimeout(() => {
              window.location.href = "/login";
            }, 2500);
            return;
          }

          showFeedback(
            data.detail ||
              "Invalid or expired reset token. Request a new link below.",
            true,
          );
        } catch (_error) {
          showFeedback(
            "Something went wrong. Try again or request a new reset link.",
            true,
          );
        }

        submitBtn.disabled = false;
      });
    </script>
  </body>
</html>
