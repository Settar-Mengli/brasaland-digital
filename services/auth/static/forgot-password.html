<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland — Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Brasaland Auth</p>
      <h1>Forgot your password?</h1>
      <p class="intro">
        Enter the email address for your Brasaland account. If it is registered,
        we will send a reset link.
      </p>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="forgot-heading">
        <h2 id="forgot-heading">Request a reset link</h2>
        <p class="hint">
          For your security, the confirmation message is the same whether or not
          the email is registered.
        </p>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submit-btn">
              Send reset link
            </button>
          </div>
        </form>

        <p
          id="status-message"
          class="message status hidden"
          role="status"
          aria-live="polite"
        ></p>

        <p class="link-row">
          <a href="/login">Back to sign in</a>
        </p>
      </section>
    </main>

    <script>
      const form = document.getElementById("forgot-form");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("submit-btn");
      const statusMessage = document.getElementById("status-message");

      const FALLBACK_MESSAGE =
        "If that email is registered, a reset link has been sent.";

      function showConfirmation(message) {
        statusMessage.textContent = message;
        statusMessage.classList.remove("hidden", "error");
        statusMessage.classList.add("status");
        statusMessage.setAttribute("role", "status");
      }

      function disableForm() {
        emailInput.disabled = true;
        submitBtn.disabled = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        disableForm();

        let message = FALLBACK_MESSAGE;

        try {
          const response = await fetch("/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailInput.value.trim() }),
          });

          if (response.ok) {
            const data = await response.json();
            if (data.message) {
              message = data.message;
            }
          }
        } catch (_error) {
          /* Same confirmation on network errors — no enumeration leak */
        }

        showConfirmation(message);
      });
    </script>
  </body>
</html>
