[project]
name = "brasaland-auth"
version = "0.1.0"
description = "JWT authentication and password reset service for Brasaland."
requires-python = ">=3.11"
dependencies = [
    "brasaland-auth-verify",
    "brasaland-proxy-trust",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "tinydb==4.8.2",
    "pydantic==2.11.4",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "resend==2.32.2",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-cov>=6.0.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.uv.sources]
brasaland-auth-verify = { path = "../../packages/auth-verify", editable = true }
brasaland-proxy-trust = { path = "../../packages/proxy-trust", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=auth --cov-report=term-missing"

[tool.coverage.run]
source = ["auth"]

[tool.coverage.report]
fail_under = 70
show_missing = true
