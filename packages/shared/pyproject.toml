[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brasaland-shared"
version = "0.1.0"
description = "Shared validation and lifecycle logic for Brasaland Python services."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["brasaland_shared*"]
