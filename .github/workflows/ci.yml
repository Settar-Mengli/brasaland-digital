name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  uv-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          [
            services/auth,
            packages/auth-verify,
            packages/shared,
            services/supplier-directory,
            services/incident-analysis,
            services/incident-manager,
            services/inventory,
            services/telemetry,
            services/reporting,
            services/knowledge,
            services/rfp,
            mcps/company-tools,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: uv run pytest
        working-directory: ${{ matrix.dir }}

  pipelines-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Run pipeline tests
        run: uv run --directory data --python 3.13 pytest

  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          ['@brasaland/operations-toolkit', '@brasaland/backoffice', '@brasaland/incident-manager']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test --workspace ${{ matrix.workspace }}

  node-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          [
            {
              workspace: '@brasaland/operations-toolkit',
              command: 'npm run typecheck --workspace @brasaland/operations-toolkit',
              working-directory: '.',
            },
            {
              workspace: '@brasaland/backoffice',
              command: 'npx tsc --noEmit',
              working-directory: 'uis/backoffice',
            },
            {
              workspace: '@brasaland/website',
              command: 'npx tsc --noEmit',
              working-directory: 'uis/website',
            },
            {
              workspace: '@brasaland/incident-manager',
              command: 'npx tsc --noEmit',
              working-directory: 'uis/incident-manager',
            },
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.working-directory }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  celery-routing:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Sync reporting deps
        run: uv sync --python 3.13
        working-directory: services/reporting
      - name: Sync rfp deps
        run: uv sync --python 3.13
        working-directory: services/rfp
      - name: Prove queue isolation on real Redis
        env:
          REDIS_URL: redis://localhost:6379/0
          CELERY_ISOLATION_ALLOW_FLUSH: '1'
        run: uv run --python 3.13 python ../../scripts/test_celery_queue_isolation.py
        working-directory: services/reporting
