name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  uv-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [services/auth, packages/auth-verify, packages/shared, services/supplier-directory, services/incident-analysis, services/incident-manager]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: uv run pytest
        working-directory: ${{ matrix.dir }}
