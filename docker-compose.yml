services:
  auth:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: auth
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - '127.0.0.1:8002:8002'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESET_EMAIL_FROM: ${RESET_EMAIL_FROM}
      RESET_LINK_BASE_URL: ${RESET_LINK_BASE_URL}
      AUTH_ALLOW_SELF_REGISTER: ${AUTH_ALLOW_SELF_REGISTER:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./services/auth:/app/services/auth
      - ./packages:/app/packages
      - auth_venv:/app/services/auth/.venv
      - auth_data:/app/services/auth/data
    restart: unless-stopped
    networks:
      - brasaland-dev

  inventory:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: inventory
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8012 --reload
    ports:
      - '127.0.0.1:8012:8012'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      DATABASE_URL: ${DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - ./services/inventory:/app/services/inventory
      - ./packages:/app/packages
      - inventory_venv:/app/services/inventory/.venv
    restart: unless-stopped
    networks:
      - brasaland-dev

  telemetry:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: telemetry
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8013 --reload
    ports:
      - '127.0.0.1:8013:8013'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      DATABASE_URL: ${DATABASE_URL}
      TELEMETRY_ENDPOINT: http://telemetry:8013/telemetry/events
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - ./services/telemetry:/app/services/telemetry
      - ./packages:/app/packages
      - telemetry_venv:/app/services/telemetry/.venv
    restart: unless-stopped
    networks:
      - brasaland-dev

  reporting:
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8014 --reload
    ports:
      - '127.0.0.1:8014:8014'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      PYTHONPATH: /app/data
    volumes:
      - ./services/reporting:/app/services/reporting
      - ./data:/app/data
      - ./packages:/app/packages
      - reporting_venv:/app/services/reporting/.venv
    restart: unless-stopped
    networks:
      - brasaland-dev

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - brasaland-dev

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
    ports:
      - '127.0.0.1:5555:5555'
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - brasaland-dev

  reporting-worker:
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    command: uv run celery -A celery_app.celery_app worker --loglevel=INFO -Q reporting
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: /app/data
    volumes:
      - ./services/reporting:/app/services/reporting
      - ./data:/app/data
      - ./packages:/app/packages
      - reporting_worker_venv:/app/services/reporting/.venv
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - brasaland-dev

  rfp:
    build:
      context: .
      dockerfile: services/rfp/Dockerfile
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8017 --reload
    ports:
      - '127.0.0.1:8017:8017'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RFP_CHECKPOINT_PATH: ${RFP_CHECKPOINT_PATH:-/app/checkpoint/rfp.sqlite}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      PYTHONPATH: /app/data
      GEN_1_BASE_URL: ${GEN_1_BASE_URL}
      GEN_1_API_KEY: ${GEN_1_API_KEY}
      GEN_1_MODEL: ${GEN_1_MODEL}
      GEN_2_BASE_URL: ${GEN_2_BASE_URL}
      GEN_2_API_KEY: ${GEN_2_API_KEY}
      GEN_2_MODEL: ${GEN_2_MODEL}
      GEN_3_BASE_URL: ${GEN_3_BASE_URL}
      GEN_3_API_KEY: ${GEN_3_API_KEY}
      GEN_3_MODEL: ${GEN_3_MODEL}
      GEN_4_BASE_URL: ${GEN_4_BASE_URL}
      GEN_4_API_KEY: ${GEN_4_API_KEY}
      GEN_4_MODEL: ${GEN_4_MODEL}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-30}
    volumes:
      - ./services/rfp:/app/services/rfp
      - ./data:/app/data
      - ./packages:/app/packages
      - rfp_venv:/app/services/rfp/.venv
      - rfp_checkpoint:/app/checkpoint
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - brasaland-dev

  rfp-worker:
    build:
      context: .
      dockerfile: services/rfp/Dockerfile
    command: uv run celery -A celery_app.celery_app worker --loglevel=INFO --pool=solo -Q rfp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RFP_CHECKPOINT_PATH: ${RFP_CHECKPOINT_PATH:-/app/checkpoint/rfp.sqlite}
      PYTHONPATH: /app/data
      GEN_1_BASE_URL: ${GEN_1_BASE_URL}
      GEN_1_API_KEY: ${GEN_1_API_KEY}
      GEN_1_MODEL: ${GEN_1_MODEL}
      GEN_2_BASE_URL: ${GEN_2_BASE_URL}
      GEN_2_API_KEY: ${GEN_2_API_KEY}
      GEN_2_MODEL: ${GEN_2_MODEL}
      GEN_3_BASE_URL: ${GEN_3_BASE_URL}
      GEN_3_API_KEY: ${GEN_3_API_KEY}
      GEN_3_MODEL: ${GEN_3_MODEL}
      GEN_4_BASE_URL: ${GEN_4_BASE_URL}
      GEN_4_API_KEY: ${GEN_4_API_KEY}
      GEN_4_MODEL: ${GEN_4_MODEL}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-30}
    volumes:
      - ./services/rfp:/app/services/rfp
      - ./data:/app/data
      - ./packages:/app/packages
      - rfp_worker_venv:/app/services/rfp/.venv
      - rfp_checkpoint:/app/checkpoint
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - brasaland-dev

  incident-manager:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: incident-manager
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8011 --reload
    ports:
      - '127.0.0.1:8011:8011'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      DATABASE_URL: ${DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - ./services/incident-manager:/app/services/incident-manager
      - ./packages:/app/packages
      - incident-manager_venv:/app/services/incident-manager/.venv
    restart: unless-stopped
    networks:
      - brasaland-dev

  incident-analysis:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: incident-analysis
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - ./services/incident-analysis:/app/services/incident-analysis
      - ./packages:/app/packages
      - incident-analysis_venv:/app/services/incident-analysis/.venv
    restart: unless-stopped
    networks:
      - brasaland-dev

  supplier-directory:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: supplier-directory
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - '127.0.0.1:8001:8001'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - ./services/supplier-directory:/app/services/supplier-directory
      - ./packages:/app/packages
      - supplier-directory_venv:/app/services/supplier-directory/.venv
      - supplier_data:/app/services/supplier-directory/data
    restart: unless-stopped
    networks:
      - brasaland-dev

  qdrant:
    image: qdrant/qdrant
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - brasaland-dev

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    command: uv run uvicorn app:app --host 0.0.0.0 --port 8015 --reload
    ports:
      - '127.0.0.1:8015:8015'
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      EXPOSE_DOCS: ${EXPOSE_DOCS:-}
      RATE_LIMIT_AGENT_QUERY: ${RATE_LIMIT_AGENT_QUERY:-10/minute}
      RATE_LIMIT_KNOWLEDGE_QUERY: ${RATE_LIMIT_KNOWLEDGE_QUERY:-20/minute}
      PYTHONPATH: /app/data
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: ${REDIS_URL}
      KNOWLEDGE_CORPUS_PATH: /app/docs/company-knowledge-base
      GEN_1_BASE_URL: ${GEN_1_BASE_URL}
      GEN_1_API_KEY: ${GEN_1_API_KEY}
      GEN_1_MODEL: ${GEN_1_MODEL}
      GEN_2_BASE_URL: ${GEN_2_BASE_URL}
      GEN_2_API_KEY: ${GEN_2_API_KEY}
      GEN_2_MODEL: ${GEN_2_MODEL}
      GEN_3_BASE_URL: ${GEN_3_BASE_URL}
      GEN_3_API_KEY: ${GEN_3_API_KEY}
      GEN_3_MODEL: ${GEN_3_MODEL}
      GEN_4_BASE_URL: ${GEN_4_BASE_URL}
      GEN_4_API_KEY: ${GEN_4_API_KEY}
      GEN_4_MODEL: ${GEN_4_MODEL}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-30}
      EMBED_MODEL_ID: ${EMBED_MODEL_ID:-BAAI/bge-small-en-v1.5}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      MCP_SERVER_URL: http://company-tools-mcp:8016/mcp
    volumes:
      - ./services/knowledge:/app/services/knowledge
      - ./data:/app/data
      - ./packages:/app/packages
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - knowledge_venv:/app/services/knowledge/.venv
    depends_on:
      - qdrant
      - company-tools-mcp
      - redis
    restart: unless-stopped
    networks:
      - brasaland-dev

  company-tools-mcp:
    build:
      context: .
      dockerfile: mcps/company-tools/Dockerfile
    command: uv run company-tools-mcp
    ports:
      - '127.0.0.1:8016:8016'
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AUTH_ISSUER_URL: http://auth:8002
      MCP_RESOURCE_URL: http://localhost:8016/mcp
      MCP_TICKETS_WRITE_ALLOWLIST: ${MCP_TICKETS_WRITE_ALLOWLIST:-}
      INCIDENTS_API_ORIGIN: http://incident-manager:8011
      INVENTORY_API_ORIGIN: http://inventory:8012
    volumes:
      - ./mcps/company-tools:/app/mcps/company-tools
      - ./packages:/app/packages
      - company_tools_mcp_venv:/app/mcps/company-tools/.venv
    depends_on:
      - incident-manager
      - inventory
    restart: unless-stopped
    networks:
      - brasaland-dev

  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    ports:
      - '3002:3002'
      - '3003:3003'
      - '3004:3004'
    environment:
      WATCHPACK_POLLING: 'true'
      INVENTORY_API_ORIGIN: http://inventory:8012
      AUTH_API_ORIGIN: http://auth:8002
      INCIDENTS_API_ORIGIN: http://incident-manager:8011
      REPORTING_API_ORIGIN: http://reporting:8014
      KNOWLEDGE_API_ORIGIN: http://knowledge:8015
      RFP_API_ORIGIN: http://rfp:8017
      NEXT_PUBLIC_INVENTORY_API_URL: http://localhost:3003/api/inventory
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:3003/api/auth
      NEXT_PUBLIC_INCIDENTS_API_URL: http://localhost:3004/api/incidents
      NEXT_PUBLIC_REPORTING_API_URL: http://localhost:3003/api/reporting
      NEXT_PUBLIC_KNOWLEDGE_API_URL: http://localhost:3003/api/knowledge
      NEXT_PUBLIC_RFP_API_URL: http://localhost:3003/api/rfp
    volumes:
      - ./uis:/app/uis
      - ./apps/operations-toolkit:/app/apps/operations-toolkit
      - ui_node_modules:/app/node_modules
      - ui_uis_node_modules:/app/uis/node_modules
    depends_on:
      - auth
      - inventory
      - incident-manager
      - reporting
      - knowledge
    restart: unless-stopped
    networks:
      - brasaland-dev

networks:
  brasaland-dev:
    name: brasaland-dev

volumes:
  auth_data:
  supplier_data:
  auth_venv:
  inventory_venv:
  telemetry_venv:
  reporting_venv:
  reporting_worker_venv:
  redis_data:
  incident-manager_venv:
  incident-analysis_venv:
  supplier-directory_venv:
  knowledge_venv:
  company_tools_mcp_venv:
  rfp_venv:
  rfp_worker_venv:
  rfp_checkpoint:
  qdrant_storage:
  ui_node_modules:
  ui_uis_node_modules:
